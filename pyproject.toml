[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rezunate-llm-sdk"
version = "0.1.2"
description = "Unified Python SDK for chat completions across multiple AI providers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
rezunate-guard = "rezunate_guard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rezunate_llm_sdk", "rezunate_guard"]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-httpx>=0.30.0",
    "responses>=0.25.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
norecursedirs = [".git", ".venv", "__pycache__"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["rezunate_llm_sdk", "rezunate_guard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
