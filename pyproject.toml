[project]
name = "llm-router"
version = "0.1.0"
description = "Unified Python SDK for chat completions across multiple AI providers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "responses>=0.25.0",
    "ruff>=0.8.0",
]
landing = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.0.0",
    "aiofiles>=23.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
norecursedirs = [".git", ".venv", "__pycache__"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".git", ".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["providers", "gateway", "landing"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
