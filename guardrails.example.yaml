# Guardrails Configuration
# Each rule defines a regex pattern applied to both input (user prompts) and
# output (LLM responses).
#
# action:
#   block  — raise a GuardrailsError, stopping the request/response
#   flag   — record a violation and log it, but let the content through
#   redact — replace every match with the rule's `replacement` text
#            (defaults to "[REDACTED]")

guardrails:
  - name: block-ssn
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
    description: "Block Social Security Numbers"
    action: block

  # Redact PII from inputs and outputs instead of blocking the whole request.
  - name: redact-email
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    description: "Redact email addresses"
    action: redact
    replacement: "[EMAIL]"

  - name: redact-phone
    pattern: '(?:\+?\d{1,3}[ -]?)?\(?\d{3}\)?[ -]?\d{3}[ -]?\d{4}\b'
    description: "Redact phone numbers"
    action: redact
    replacement: "[PHONE]"

  - name: redact-credit-card
    pattern: '\b(?:\d[ -]*?){13,16}\b'
    description: "Redact credit card numbers"
    action: redact
    replacement: "[CREDIT_CARD]"

  - name: flag-api-key
    pattern: '\bsk-[A-Za-z0-9]{20,}\b'
    description: "Flag leaked API keys"
    action: flag
